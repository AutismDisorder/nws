name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (all targets, all features, -D warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit + integration tests
        run: cargo test --all-features

      - name: Fuzz smoke (10k mutations)
        run: cargo run --release --example fuzz_smoke -- 10000

      - name: Parity vs mozilla/readability test-pages corpus
        run: |
          git clone --depth 1 https://github.com/mozilla/readability.git /tmp/readability
          cargo run --release --example parity -- /tmp/readability/test/test-pages
