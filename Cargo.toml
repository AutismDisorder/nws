[package]
name = "nws"
version = "0.1.0"
repository = "https://github.com/AutismDisorder/nws"
homepage = "https://github.com/AutismDisorder/nws"
documentation = "https://docs.rs/nws"
edition = "2021"
description = "Article extraction engine — the newspaper3k / mercury-parser / readability lineage rebuilt in Rust, heavily optimized"
license = "AGPL-3.0-or-later"
keywords = ["extraction", "article", "readability", "scraping", "newspaper"]
categories = ["text-processing", "web-programming"]
exclude = ["RUNBOOK/"]

[features]
default = ["http"]
http = ["dep:tokio", "dep:reqwest", "dep:image", "dep:futures-util", "dep:encoding_rs"]
server = ["http", "dep:axum"]

[dependencies]
html5ever = "0.39"
markup5ever = "0.39"
markup5ever_rcdom = "0.39"
regex = "1.13"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
whatlang = "0.18"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.12"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2", "gzip", "brotli", "deflate", "stream"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
encoding_rs = { version = "0.8", optional = true }
axum = { version = "0.8", features = ["json"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"], optional = true }

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "extract"
harness = false

[[bin]]
name = "nws"
path = "src/main.rs"

[[bin]]
name = "nws-server"
path = "src/bin/server.rs"
required-features = ["server"]

[profile.release]
lto = "thin"
codegen-units = 1
